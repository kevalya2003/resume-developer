name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: resume-developer/package-lock.json

      - name: Install
        working-directory: resume-developer
        run: npm ci

      - name: Typecheck
        working-directory: resume-developer
        run: npm run typecheck

      - name: Lint
        working-directory: resume-developer
        run: npm run lint

      - name: Unit tests
        working-directory: resume-developer
        run: npm run test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: resume-developer/package-lock.json

      - name: Install
        working-directory: resume-developer
        run: npm ci

      # Chromium is a runtime dependency here, not just a test one: PDF export
      # goes through Playwright.
      - name: Install Chromium
        working-directory: resume-developer
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        working-directory: resume-developer
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: resume-developer/playwright-report/
          retention-days: 7

  # Building the image is not enough on its own: the standalone output only
  # contains what Next's tracer could follow, and the two packages that load
  # data files by a computed path have both been missing from it at some point.
  # That failure appears at the first render, not at build time, so the image
  # has to actually render something before it can be called good.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        working-directory: resume-developer
        run: docker build -t resume-developer:ci .

      - name: Start container
        run: |
          docker run -d --name rd --publish 3000:3000 resume-developer:ci
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/api/health > /dev/null; then
              echo "healthy after $((i * 3))s"; exit 0
            fi
            sleep 3
          done
          echo "never became healthy"; docker logs rd; exit 1

      - name: Render a PDF and read it back
        run: |
          body='{"resume":{"version":1,"basics":{"name":"CI Probe","headline":"QA","email":"ci@example.com","phone":"1","location":"X","links":[]},"sections":[]},"composition":{"layout":"classic","type":"carlito","density":"normal","accent":"ink"},"scale":1}'

          curl -fsS -X POST http://127.0.0.1:3000/api/render \
            -H 'content-type: application/json' -d "$body" -o out.pdf
          head -c 5 out.pdf | grep -q '%PDF-' || { echo "not a PDF"; exit 1; }
          # A six-letter tag before the family name is how an embedded subset is
          # named; without it the PDF is relying on fonts the reader may not have.
          grep -aqE '[A-Z]{6}\+Carlito' out.pdf || { echo "font not embedded"; exit 1; }

          curl -fsS -X POST http://127.0.0.1:3000/api/ats \
            -H 'content-type: application/json' -d "$body" | grep -q 'CI Probe' \
            || { echo "ATS could not read the PDF back"; exit 1; }

      - name: Container logs
        if: always()
        run: docker logs rd
