services:
  resume-developer:
    build: .
    image: resume-developer:local
    ports:
      - "3000:3000"
    environment:
      # Two concurrent renders on two cores. Each one holds a browser context,
      # so this is the setting to change when moving to a larger or smaller box —
      # raising it past the core count buys queueing, not throughput.
      RESUME_RENDER_CONCURRENCY: "2"
      RESUME_QUEUE_TIMEOUT_MS: "20000"
      RESUME_RATE_CAPACITY: "20"
      RESUME_RATE_REFILL_PER_MINUTE: "20"
      RESUME_MAX_BODY_BYTES: "524288"
    restart: unless-stopped
    # Chromium is not modest. Two contexts plus the Node server sit comfortably
    # under 1.5GB; the ceiling is here so a runaway render is killed rather than
    # taking the host down with it.
    mem_limit: 2g
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
